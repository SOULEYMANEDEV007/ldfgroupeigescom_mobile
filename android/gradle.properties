org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=true

# ── Mode hors-ligne ─────────────────────────────────────────────────────────
# Tous les artifacts (AGP 9.0.1, Kotlin 2.3.20, Gradle 9.1.0) sont en cache
# local. Ce flag empêche Gradle de contacter les serveurs Maven inaccessibles.
org.gradle.offline=true

# ── Désactiver le SDK Manager automatique ────────────────────────────────────
# build-tools 35/36/37 déjà installées — empêche les re-téléchargements réseau.
android.sdk.download.auto=false
